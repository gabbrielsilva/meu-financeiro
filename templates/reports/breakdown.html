{% for group in groups %}<details class="group-detail"><summary><span>{{ group.name }}</span><strong>R$ {{ group.amount|floatformat:'2g' }}</strong></summary><ul>{% for sub in group.subcategories %}<li><span>{{ sub.name }}</span><span>R$ {{ sub.amount|floatformat:'2g' }}</span></li>{% endfor %}</ul></details>{% empty %}<p class="text-secondary small mt-3">Nenhum registro neste período.</p>{% endfor %}
